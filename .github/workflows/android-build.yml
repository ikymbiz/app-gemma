# Builds a debug APK on every push to main and on demand.
# The artifact is downloadable from the workflow run page on GitHub for ~30 days.

name: Android build

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemma-bridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show APK info
        if: always()
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
            echo "Build succeeded — download the artifact from the Actions tab."
          else
            echo "APK was not produced. Check the build logs above."
          fi
