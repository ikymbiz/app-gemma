name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (例: v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show context
        run: ls -la

      - name: Auto-extract ZIP files
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "📦 Extracting $z"
            unzip -o "$z"
          done

      - name: Locate Gradle project
        id: find
        run: |
          SETTINGS=$(find . -maxdepth 4 -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "./.git/*" 2>/dev/null | head -n1)
          [ -z "$SETTINGS" ] && echo "::error::settings.gradle not found" && exit 1
          ROOT=$(dirname "$SETTINGS"); ROOT="${ROOT#./}"; [ -z "$ROOT" ] && ROOT="."
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          [ "$ROOT" = "." ] && echo "prefix=" >> "$GITHUB_OUTPUT" || echo "prefix=$ROOT/" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          build-root-directory: ${{ steps.find.outputs.root }}

      - name: Generate Gradle wrapper if missing
        working-directory: ${{ steps.find.outputs.root }}
        run: |
          [ ! -f gradlew ] && gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      # 署名キーが Secrets にあれば署名ビルド、なければ unsigned でも通す
      - name: Decode keystore if provided
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (signed)
        if: ${{ steps.keystore.outputs.path != '' }}
        working-directory: ${{ steps.find.outputs.root }}
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -x test

      - name: Build release APK (unsigned)
        if: ${{ steps.keystore.outputs.path == '' }}
        working-directory: ${{ steps.find.outputs.root }}
        run: ./gradlew assembleRelease --no-daemon -x test

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.prefix }}app/build/outputs/apk/release/*.apk
          generate_release_notes: true
